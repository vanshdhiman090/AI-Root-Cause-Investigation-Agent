# Pings the free-tier demo API so the first recruiter visit is not a cold start.
# Render's free tier sleeps after ~15 minutes idle; GitHub cron is best-effort,
# so this reduces cold starts but cannot guarantee zero.
name: keep-demo-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping demo API health endpoint
        run: |
          curl --silent --show-error --fail --max-time 90 --retry 2 \
            https://ai-root-cause-investigation-agent.onrender.com/health/live
